
name: Donor Search — Phoenix Hub Alpha

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch for generated results"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: donor-search-alpha-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  donor-search:
    name: Run scanner, preserve results, upload artifacts and push
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Download and validate current scanner
        shell: bash
        env:
          SCANNER_URL: https://raw.githubusercontent.com/findmydevice364-hub/zala/main/Donor_search.py
        run: |
          set -euo pipefail

          SCANNER_PATH="${RUNNER_TEMP}/Donor_search.py"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "${SCANNER_URL}" \
            --output "${SCANNER_PATH}"

          test -s "${SCANNER_PATH}"
          python -m py_compile "${SCANNER_PATH}"

          echo "Scanner syntax validation passed."
          echo "Scanner path: ${SCANNER_PATH}"

      - name: Run scanner and create results
        id: scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_WORKERS: "8"
          PARSING_WORKERS: "35"
          STREAM_CHECK_WORKERS: "40"
          PHOENIX_LAUNCH_MODE: "github_actions_alpha"
          PHOENIX_SCAN_ACTIVE: "1"
          SCANNER_PATH: ${{ runner.temp }}/Donor_search.py
          SCANNER_LOG: ${{ runner.temp }}/donor_search_run.log
        run: |
          set -uo pipefail

          echo "Starting Donor_search.py."
          echo "Working directory: ${GITHUB_WORKSPACE}"
          echo "Search workers: ${SEARCH_WORKERS}"
          echo "Parsing workers: ${PARSING_WORKERS}"
          echo "Stream-check workers: ${STREAM_CHECK_WORKERS}"

          cd "${GITHUB_WORKSPACE}"

          python "${SCANNER_PATH}" 2>&1 | tee "${SCANNER_LOG}"
          scanner_exit_code=${PIPESTATUS[0]}

          echo "exit_code=${scanner_exit_code}" >> "${GITHUB_OUTPUT}"

          if [[ "${scanner_exit_code}" -ne 0 ]]; then
            echo "Scanner failed with exit code ${scanner_exit_code}."
            exit "${scanner_exit_code}"
          fi

          echo "Scanner completed successfully."

      # Публикуем только после успешного завершения сканера.
      # Сначала сохраняем снимок всех найденных выходных файлов.
      - name: Inventory generated results
        id: inventory
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          mkdir -p "${RUNNER_TEMP}/donor-publish-manifest"

          MANIFEST="${RUNNER_TEMP}/donor-publish-manifest/files.txt"
          : > "${MANIFEST}"

          # Все файлы в каталоге data/.
          if [[ -d data ]]; then
            find data -type f -print >> "${MANIFEST}"
          fi

          # Выходные файлы в корне репозитория.
          find . -maxdepth 1 -type f \( \
            -iname '*.m3u' -o \
            -iname '*.m3u8' -o \
            -iname '*.m3u4' -o \
            -iname '*.m3uplus' -o \
            -iname '*.json' -o \
            -iname '*.txt' -o \
            -iname '*.csv' -o \
            -iname '*.sqlite' -o \
            -iname '*.db' \
          \) -print >> "${MANIFEST}"

          # Также включаем такие результаты во вложенных каталогах.
          find . -mindepth 2 -type f \( \
            -iname '*.m3u' -o \
            -iname '*.m3u8' -o \
            -iname '*.m3u4' -o \
            -iname '*.m3uplus' -o \
            -iname '*.json' -o \
            -iname '*.txt' -o \
            -iname '*.csv' -o \
            -iname '*.sqlite' -o \
            -iname '*.db' \
          \) \
            -not -path './.git/*' \
            -print >> "${MANIFEST}"

          # Удаляем дубликаты путей и сохраняем список.
          sort -u "${MANIFEST}" -o "${MANIFEST}"

          count="$(grep -c . "${MANIFEST}" || true)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

          echo "Discovered ${count} result files."
          cat "${MANIFEST}"

      - name: Commit and push results without staging deletions
        id: publish
        if: success() && steps.inventory.outputs.count != '0'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          MANIFEST="${RUNNER_TEMP}/donor-publish-manifest/files.txt"

          # Не используем git add -A:
          # отсутствующие файлы не должны удаляться из ветки.
          staged_count=0

          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue

            # Удалённые или исчезнувшие файлы пропускаем.
            [[ -f "${file}" ]] || continue

            # Добавляем существующие результаты, в том числе
            # если они были исключены правилами .gitignore.
            git add -f -- "${file}"
            staged_count=$((staged_count + 1))
          done < "${MANIFEST}"

          echo "Existing result paths staged: ${staged_count}"

          if git diff --cached --quiet; then
            echo "No new changes to publish."
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Files to publish:"
          git diff --cached --stat

          git commit \
            -m "chore: publish donor scanner results [skip ci]"

          # Синхронизируем целевую ветку и проверяем,
          # что публикация не перезаписывает чужие изменения.
          git fetch origin "${TARGET_BRANCH}"

          git rebase "origin/${TARGET_BRANCH}"

          git push origin "HEAD:${TARGET_BRANCH}"

          echo "pushed=true" >> "${GITHUB_OUTPUT}"
          echo "Results pushed to ${TARGET_BRANCH}."

      # Артефакты GitHub Actions сохраняются отдельно от Git-коммита.
      # Загрузка выполняется и при ошибке сканера для диагностики.
      - name: Upload alpha diagnostics and generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-search-alpha-diagnostics
          path: |
            ${{ runner.temp }}/donor_search_run.log
            data/**
            *.m3u
            *.m3u8
            *.m3u4
            *.m3uplus
            *.json
            *.txt
            *.csv
            *.sqlite
            *.db
            **/*.m3u
            **/*.m3u8
            **/*.m3u4
            **/*.m3uplus
            **/*.json
            **/*.txt
            **/*.csv
            **/*.sqlite
            **/*.db
          if-no-files-found: warn
          retention-days: 14
