
name: ZALA RAW Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zala-raw-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download RAW scanner.py
        run: |
          curl -fL \
            https://raw.githubusercontent.com/findmydevice364-hub/zala/refs/heads/main/scanner.py \
            -o scanner.py

      - name: Run RAW scanner
        run: |
          python -u scanner.py

      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZALA-RAW-Scanner-Results
          path: |
            FOUND_CHANNELS.m3u
            scan_state.json
            DREG_log.txt
            SKALA_log.txt
          if-no-files-found: warn
          retention-days: 14
