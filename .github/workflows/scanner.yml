
name: ZALA RAW Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zala-raw-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download RAW scanner.py
        run: |
          curl -fL \
            https://raw.githubusercontent.com/findmydevice364-hub/zala/refs/heads/main/scanner.py \
            -o scanner.py

      - name: Run RAW scanner
        run: |
          python -u scanner.py

      - name: Save results to repository root
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f FOUND_CHANNELS.m3u scan_state.json DREG_log.txt SKALA_log.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update IPTV scanner results"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to save"
          fi
