
name: IPTV Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Scan IPTV Node
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start IPTV Scanner
        run: |
          python -u scanner.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Scanner-Results
          path: |
            FOUND_CHANNELS.m3u
            scan_state.json
            DREG_log.txt
            SKALA_log.txt
          if-no-files-found: warn
          retention-days: 14
