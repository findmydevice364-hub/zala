
name: Zala Inspect

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: zala-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: Run zala_inspect.py
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download zala_inspect.py from raw GitHub
        run: |
          set -euo pipefail

          RAW_URL="https://raw.githubusercontent.com/findmydevice364-hub/zala/main/zala_inspect.py"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-redirs 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "$RAW_URL" \
            --output zala_inspect.py

          test -s zala_inspect.py

          echo "Downloaded script:"
          wc -l zala_inspect.py
          sha256sum zala_inspect.py

      - name: Compile Python script
        run: python -m py_compile zala_inspect.py

      - name: Run zala_inspect.py
        run: python -u zala_inspect.py

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zala-inspect-report-${{ github.run_number }}
          path: |
            zala_diagnostic_report.txt
            zala_diagnostic_report.json
          if-no-files-found: warn
          retention-days: 14
