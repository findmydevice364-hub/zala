name: git_bot_for_stable.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 03:00 Калининград (UTC+2)

permissions:
  contents: write

concurrency:
  group: git-bot-for-stable
  cancel-in-progress: false

jobs:
  run-bot:
    name: Run git_bot_for_stable.py
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot (без push)
        env:
          SKIP_PUSH: "true"
          DREG_INCLUDE_IN_GIT: "false"
        run: python -u git_bot_for_stable.py

      # ---- Логи/отчёты в артефакты (не в git) ----
      - name: Upload DREG logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreg-logs-${{ github.run_id }}
          path: |
            logs/
          retention-days: 14
          if-no-files-found: ignore

      # ---- В git только плейлисты ----
      - name: Commit and push only playlists
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Только плейлисты (подправь список под свои файлы)
          PLAYLISTS=(
            "stable.m3u"
            "IPTVmir.m3u8"
            "legacy/IPTVstable.m3u8"
            "RTRS_stable.m3u8"
          )

          # Добавляем только существующие
          to_add=()
          for f in "${PLAYLISTS[@]}"; do
            if [ -f "$f" ]; then
              to_add+=("$f")
            fi
          done

          if [ ${#to_add[@]} -eq 0 ]; then
            echo "No playlist files found."
            exit 0
          fi

          git add -- "${to_add[@]}"

          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git commit -m "Update playlists via git_bot_for_stable.py"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 3
          done

          echo "::error::Push failed after 3 attempts."
          exit 1