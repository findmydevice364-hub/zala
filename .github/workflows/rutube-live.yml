name: RUTUBE Live — обновление плейлиста

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Максимум страниц общей ленты Rutube"
        required: false
        default: "30"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: rutube-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Поиск эфиров и публикация M3U
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: python -m pip install --upgrade pip requests

      - name: Проверить наличие скрипта
        run: |
          test -f bl_rutube.py || {
            echo "::error::Файл bl_rutube.py не найден в корне репозитория"
            exit 1
          }

      - name: Найти публичные трансляции Rutube и собрать M3U
        env:
          MAX_PAGES: ${{ inputs.max_pages || '30' }}
        run: |
          python bl_rutube.py \
            --max-pages "$MAX_PAGES" \
            --delay 0.4 \
            --output Rutube_ALL_LIVE.m3u

          test -s Rutube_ALL_LIVE.m3u
          test -s Rutube_ALL_LIVE_scan_report.txt

      - name: Сохранить результат в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Rutube_ALL_LIVE.m3u Rutube_ALL_LIVE_scan_report.txt

          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не требуется."
          else
            git commit -m "chore(rutube): refresh live playlist"
            git push
          fi

      - name: Загрузить файлы в Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rutube-live-${{ github.run_number }}
          path: |
            Rutube_ALL_LIVE.m3u
            Rutube_ALL_LIVE_scan_report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Создать или обновить Release с плейлистом
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rutube-live-latest
          target_commitish: ${{ github.ref_name }}
          name: "RUTUBE Live — актуальный плейлист"
          body: |
            Автоматически обновляемый список публичных прямых трансляций Rutube.

            Файлы:
            - `Rutube_ALL_LIVE.m3u` — плейлист;
            - `Rutube_ALL_LIVE_scan_report.txt` — отчёт поиска.

            Источник: публичная лента Rutube и ответы API плеера.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            Rutube_ALL_LIVE.m3u
            Rutube_ALL_LIVE_scan_report.txt
