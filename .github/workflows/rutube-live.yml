
name: RUTUBE TV — обновление плейлиста

on:
  workflow_dispatch:
    inputs:
      feed_pages:
        description: "Максимум страниц каталогов и витрин Rutube"
        required: false
        default: "30"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: rutube-tv-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Поиск телеканалов и публикация M3U
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Проверить входные файлы
        run: |
          test -f bl_rutube.py || {
            echo "::error::bl_rutube.py не найден"
            exit 1
          }

          test -f Rutubefile.txt || {
            echo "::error::Rutubefile.txt не найден"
            exit 1
          }

      - name: Найти телеканалы Rutube и собрать M3U
        env:
          FEED_PAGES: ${{ inputs.feed_pages || '30' }}
        run: |
          python bl_rutube.py \
            Rutubefile.txt \
            --feed-pages "$FEED_PAGES" \
            --delay 0.4 \
            --output Rutube_TV.m3u

          test -s Rutube_TV.m3u
          test -s Rutube_TV_scan_report.txt

      - name: Сохранить результат в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Rutube_TV.m3u Rutube_TV_scan_report.txt

          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не требуется."
          else
            git commit -m "chore(rutube): refresh TV playlist"
            git push
          fi

      - name: Загрузить файлы в Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rutube-tv-${{ github.run_number }}
          path: |
            Rutube_TV.m3u
            Rutube_TV_scan_report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Создать или обновить Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rutube-tv-latest
          target_commitish: main
          name: "RUTUBE TV — актуальный плейлист"
          body: |
            Автоматически обновляемый плейлист телеканалов Rutube.

            Файлы:
            - Rutube_TV.m3u — плейлист телеканалов;
            - Rutube_TV_scan_report.txt — отчёт сканирования.

            Источник: каталоги и витрины Rutube,
            проверка HLS через API плеера.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            Rutube_TV.m3u
            Rutube_TV_scan_report.txt
