
name: Phoenix URL Dissector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: phoenix-url-dissector
  cancel-in-progress: false

jobs:
  run-dissector:
    name: Discover and analyze LiveM3U playlists
    runs-on: ubuntu-latest
    timeout-minutes: 760

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Python script from Raw GitHub
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/findmydevice364-hub/zala/main/URL_Dessector.py"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 180 \
            "$SCRIPT_URL" \
            --output URL_Dessector.py

          test -s URL_Dessector.py

          if head -c 500 URL_Dessector.py | grep -qiE '<!DOCTYPE html|<html'; then
            echo "::error::Downloaded HTML instead of a Python script."
            exit 1
          fi

          echo "Downloaded script:"
          wc -l URL_Dessector.py

      - name: Check Python syntax
        run: python -m py_compile URL_Dessector.py

      - name: Run URL Dissector
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          python -u URL_Dessector.py \
            --discover-livem3u \
            --mode deep \
            --timeout 30 \
            --max-bytes 52428800 \
            --max-total-bytes 5368709120 \
            --max-runtime 18000 \
            --max-requests 100000 \
            --max-depth 50 \
            --max-segments 1000 \
            --max-children 100000 \
            --max-redirects 50 \
            --max-sources 100000 \
            --output-dir reports \
            --name livem3u

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-url-dissector-reports
          path: |
            reports/
            *.txt
            *.json
            *.log
            *.m3u
            *.m3u8
          if-no-files-found: warn
          retention-days: 30
