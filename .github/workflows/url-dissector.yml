
name: URL_Dessector.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 6" # 00:00 МСК каждое воскресенье

permissions:
  contents: write
  actions: write

concurrency:
  group: git-for-uz-lists
  cancel-in-progress: false

jobs:
  run-bot:
    name: Run URL_Dessector.py
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check two-week schedule
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual launch: bypassing schedule check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          START_DATE="2026-11-21"
          TODAY="$(date -u +%Y-%m-%d)"

          START_TS="$(date -u -d "$START_DATE" +%s)"
          TODAY_TS="$(date -u -d "$TODAY" +%s)"

          DAYS=$(( (TODAY_TS - START_TS) / 86400 ))

          if [ "$DAYS" -ge 0 ] && [ $((DAYS % 14)) -eq 0 ]; then
            echo "Two-week interval confirmed."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Two-week interval not reached. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Download URL_Dessector.py
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/findmydevice364-hub/zala/main/URL_Dessector.py"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SCRIPT_URL" \
            -o URL_Dessector.py

          test -s URL_Dessector.py
          python -m py_compile URL_Dessector.py

      - name: Run URL_Dessector.py
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -u URL_Dessector.py

      - name: Upload complete DREG logs
        if: always() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Hub-DREG-Logs-${{ github.run_number }}
          path: |
            Main/logs/SCALA_DREG.log
            Main/logs/TITAN_DREG.log
            Main/logs/SCALA_DREG_TITAN.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Commit and push playlists only
        if: success() && steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          touch .gitignore

          grep -qxF '.tools/ffmpeg/ffprobe' .gitignore || \
            echo '.tools/ffmpeg/ffprobe' >> .gitignore

          grep -qxF '.tools/ffmpeg/ffprobe.exe' .gitignore || \
            echo '.tools/ffmpeg/ffprobe.exe' >> .gitignore

          grep -qxF '__pycache__/' .gitignore || \
            echo '__pycache__/' >> .gitignore

          grep -qxF '*.py[cod]' .gitignore || \
            echo '*.py[cod]' >> .gitignore

          FILES=(
            "Main/donors_uz.m3u"
            "Main/stable_uz.m3u"
          )

          for file in "${FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty playlist: $file"
              exit 1
            fi
          done

          git add -f -- "${FILES[@]}"
          git add -- .gitignore

          ALLOWED="$(printf '%s\n' \
            ".gitignore" \
            "Main/donors_uz.m3u" \
            "Main/stable_uz.m3u")"

          ACTUAL="$(git diff --cached --name-only)"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if ! printf '%s\n' "$ALLOWED" | grep -Fxq -- "$file"; then
              echo "::error::Unexpected file staged for commit: $file"
              exit 1
            fi
          done <<< "$ACTUAL"

          if git diff --cached --quiet; then
            echo "No playlist or configuration changes to commit."
            exit 0
          fi

          echo "Files prepared for commit:"
          git diff --cached --name-only

          git commit -m "Update Uzbek playlists"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 3
          done

          echo "::error::Push failed after 3 attempts."
          exit 1
