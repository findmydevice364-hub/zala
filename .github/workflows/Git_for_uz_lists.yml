
name: Git_for_uz_lists.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 6" # 00:00 МСК каждое воскресенье

permissions:
  contents: write

concurrency:
  group: git-for-uz-lists
  cancel-in-progress: false

jobs:
  run-bot:
    name: Run Git_for_uz_lists.py
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check two-week schedule
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual launch: bypassing schedule check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          START_DATE="2026-11-16"
          TODAY="$(date -u +%Y-%m-%d)"

          START_TS="$(date -u -d "$START_DATE" +%s)"
          TODAY_TS="$(date -u -d "$TODAY" +%s)"

          DAYS=$(( (TODAY_TS - START_TS) / 86400 ))

          if [ "$DAYS" -ge 0 ] && [ $((DAYS % 14)) -eq 0 ]; then
            echo "Two-week interval confirmed."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Two-week interval not reached. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -c "import requests; print('requests OK:', requests.__version__)"

      - name: Download Git_for_uz_lists.py
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/findmydevice364-hub/zala/refs/heads/main/Git_for_uz_lists.py"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SCRIPT_URL" \
            -o Git_for_uz_lists.py

          test -s Git_for_uz_lists.py
          python -m py_compile Git_for_uz_lists.py

      - name: Run Git_for_uz_lists.py
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -u Git_for_uz_lists.py

      - name: Prepare playlists and three DREG logs
        if: success() && steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Main/logs

          # Обязательные плейлисты.
          for file in \
            Main/donors_uz.m3u \
            Main/stable_uz.m3u
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required playlist missing or empty: $file"
              exit 1
            fi
          done

          # Обязательные исходные журналы.
          for file in \
            Main/logs/SCALA_DREG.log \
            Main/logs/TITAN_DREG.log
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required log missing or empty: $file"
              exit 1
            fi
          done

          # Формирование единого журнала SCALA + TITAN.
          COMMON_TMP="Main/logs/SCALA_DREG_TITAN.log.tmp"

          {
            echo "=================================================="
            echo "PHOENIX HUB — SCALA DREG + TITAN DREG"
            echo "UNIFIED COMBINED LOG"
            echo "Generated UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "=================================================="
            echo

            echo "=================================================="
            echo "SCALA DREG — GENERAL DETAILS"
            echo "=================================================="
            cat Main/logs/SCALA_DREG.log
            echo

            echo "=================================================="
            echo "TITAN DREG — EXTENDED DETAILS"
            echo "=================================================="
            cat Main/logs/TITAN_DREG.log
            echo

            echo "=================================================="
            echo "END OF UNIFIED LOG"
            echo "=================================================="
          } > "$COMMON_TMP"

          mv "$COMMON_TMP" Main/logs/SCALA_DREG_TITAN.log

          test -s Main/logs/SCALA_DREG_TITAN.log

          echo "Both playlists and all three logs are ready."

      - name: Commit and push only five output files
        if: success() && steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Исключаем бинарники и временный Python-кэш.
          touch .gitignore

          grep -qxF '.tools/ffmpeg/ffprobe' .gitignore || \
            echo '.tools/ffmpeg/ffprobe' >> .gitignore

          grep -qxF '.tools/ffmpeg/ffprobe.exe' .gitignore || \
            echo '.tools/ffmpeg/ffprobe.exe' >> .gitignore

          grep -qxF '__pycache__/' .gitignore || \
            echo '__pycache__/' >> .gitignore

          grep -qxF '*.py[cod]' .gitignore || \
            echo '*.py[cod]' >> .gitignore

          # Добавляем исключительно пять результатов.
          git add -f -- \
            Main/donors_uz.m3u \
            Main/stable_uz.m3u \
            Main/logs/SCALA_DREG.log \
            Main/logs/TITAN_DREG.log \
            Main/logs/SCALA_DREG_TITAN.log

          # Сохраняем правила исключения.
          git add -- .gitignore

          # Контроль состава коммита.
          ACTUAL="$(git diff --cached --name-only | sort)"

          EXPECTED="$(
            printf '%s\n' \
              .gitignore \
              Main/donors_uz.m3u \
              Main/logs/SCALA_DREG.log \
              Main/logs/TITAN_DREG.log \
              Main/logs/SCALA_DREG_TITAN.log \
              Main/stable_uz.m3u | sort
          )"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected files in commit."
            echo "Actual:"
            printf '%s\n' "$ACTUAL"
            echo "Expected:"
            printf '%s\n' "$EXPECTED"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Uzbekistan playlists and DREG logs"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 3
          done

          echo "::error::Push failed after 3 attempts."
          exit 1
