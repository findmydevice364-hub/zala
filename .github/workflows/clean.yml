
name: Clean IPTV Playlist

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, например v1.0.0 (оставь пустым, чтобы пропустить Release)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "clean.py"
      - ".github/workflows/clean.yml"

permissions:
  contents: write

concurrency:
  group: clean-iptv-playlist
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run clean.py
        run: python clean.py

      - name: Validate generated playlist
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("playlist_clean.m3u")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("ERROR: playlist_clean.m3u is missing or empty")

          content = path.read_text(encoding="utf-8-sig")
          if not content.lstrip().startswith("#EXTM3U"):
              raise SystemExit("ERROR: Invalid M3U header")

          print(f"Playlist size: {path.stat().st_size} bytes")
          print("M3U header: OK")
          PY

      - name: Commit generated files to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist_clean.m3u playlist_report.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update cleaned IPTV playlist"
            git push origin HEAD:main
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-iptv-playlist
          path: |
            playlist_clean.m3u
            playlist_report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish files to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              playlist_clean.m3u playlist_report.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              playlist_clean.m3u playlist_report.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "Clean IPTV Playlist $TAG" \
              --generate-notes
          fi
